<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neighbor-Chain Cipher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f4f4f4;
    }
    h1 {
      color: #333;
    }
    label, textarea, input, button {
      display: block;
      margin: 0.5rem 0;
    }
    textarea, input {
      width: 100%;
      padding: 0.5rem;
    }
    button {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    .output {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>Neighbor-Chain Cipher</h1>

<label for="plaintext">Plaintext:</label>
<textarea id="plaintext" rows="2">test</textarea>

<label for="key">Key (comma-separated numbers):</label>
<input id="key" value="3,5,1,5">

<button onclick="encodeText()">Encode</button>
<button onclick="decodeText()">Decode</button>

<div class="output" id="encoded"></div>
<div class="output" id="decoded"></div>

<script>
function charToNum(c) {
  return c.toLowerCase().charCodeAt(0) - 'a'.charCodeAt(0);
}

function numToChar(n, isUpper) {
  const base = isUpper ? 'A'.charCodeAt(0) : 'a'.charCodeAt(0);
  return String.fromCharCode((n % 26) + base);
}

function modInverse(a, m = 26) {
  a = a % m;
  for (let x = 1; x < m; x++) {
    if ((a * x) % m === 1) return x;
  }
  return null;
}

function extractLetters(text) {
  let letters = [];
  let nonLetters = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (/[a-zA-Z]/.test(ch)) {
      letters.push({ char: ch, upper: ch === ch.toUpperCase() });
    } else {
      nonLetters.push({ index: i, char: ch });
    }
  }
  return { letters, nonLetters };
}

function reinsertNonLetters(transformedLetters, nonLetters) {
  let result = [];
  let letterIndex = 0;
  for (let i = 0; i < transformedLetters.length + nonLetters.length; i++) {
    const nonLetter = nonLetters.find(n => n.index === i);
    if (nonLetter) {
      result.push(nonLetter.char);
    } else {
      result.push(transformedLetters[letterIndex]);
      letterIndex++;
    }
  }
  return result.join('');
}

function encode(plaintext, key) {
  const { letters, nonLetters } = extractLetters(plaintext);
  if (letters.length === 0) return plaintext;

  let keyLen = key.length;
  let ciphertextNums = [];

  const firstNum = charToNum(letters[0].char);
  const encFirst = (firstNum + key[0]) % 26;
  ciphertextNums.push(encFirst);

  for (let i = 1; i < letters.length; i++) {
    const currNum = charToNum(letters[i].char);
    const prevNum = charToNum(letters[i - 1].char);
    const diff = (currNum - prevNum + 26) % 26;
    const keyElement = key[i % keyLen];
    const encVal = (diff * keyElement) % 26;
    ciphertextNums.push(encVal);
  }

  const transformed = ciphertextNums.map((num, i) =>
    numToChar(num, letters[i].upper)
  );

  return reinsertNonLetters(transformed, nonLetters);
}

function decode(ciphertext, key) {
  const { letters, nonLetters } = extractLetters(ciphertext);
  if (letters.length === 0) return ciphertext;

  let keyLen = key.length;
  let plaintextNums = [];

  const firstEnc = charToNum(letters[0].char);
  const firstPlain = (firstEnc - key[0] + 26) % 26;
  plaintextNums.push(firstPlain);

  for (let i = 1; i < letters.length; i++) {
    const encVal = charToNum(letters[i].char);
    const keyElement = key[i % keyLen];
    const inv = modInverse(keyElement);
    if (inv === null) return `Error: No modular inverse for key element ${keyElement}`;
    const diff = (encVal * inv) % 26;
    const currPlain = (plaintextNums[i - 1] + diff) % 26;
    plaintextNums.push(currPlain);
  }

  const transformed = plaintextNums.map((num, i) =>
    numToChar(num, letters[i].upper)
  );

  return reinsertNonLetters(transformed, nonLetters);
}

function parseKey(input) {
  return input.split(',').map(x => parseInt(x.trim())).filter(n => !isNaN(n));
}

function encodeText() {
  const plaintext = document.getElementById("plaintext").value;
  const key = parseKey(document.getElementById("key").value);
  const result = encode(plaintext, key);
  document.getElementById("encoded").textContent = "Encoded: " + result;
}

function decodeText() {
  const ciphertext = document.getElementById("plaintext").value;
  const key = parseKey(document.getElementById("key").value);
  const result = decode(ciphertext, key);
  document.getElementById("decoded").textContent = "Decoded: " + result;
}
</script>
</body>
</html>
